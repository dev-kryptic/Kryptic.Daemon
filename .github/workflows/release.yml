name: Signed Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build/release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}${{ inputs.tag }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: Kryptic
  BUNDLE_ID: dev.kryptic.daemon

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3. Got: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.display }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            runner: macos-15
            label: apple-silicon
            display: Apple Silicon
          - goarch: amd64
            runner: macos-15-intel
            label: intel
            display: Intel

    runs-on: ${{ matrix.runner }}
    environment: release-signing
    permissions:
      contents: read
    env:
      LABEL: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create temporary keychain and import Developer ID certificates
        shell: bash
        env:
          APP_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/kryptic-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APP_P12_B64" | base64 --decode > "$RUNNER_TEMP/developer-id-application.p12"
          echo "$INSTALLER_P12_B64" | base64 --decode > "$RUNNER_TEMP/developer-id-installer.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/developer-id-application.p12" \
            -k "$KEYCHAIN" \
            -P "$APP_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security import "$RUNNER_TEMP/developer-id-installer.p12" \
            -k "$KEYCHAIN" \
            -P "$INSTALLER_P12_PASSWORD" \
            -T /usr/bin/productbuild \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

      - name: Build CLI
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH="$GOARCH" \
            go build -trimpath \
            -ldflags "-X github.com/dev-kryptic/daemon/internal/server.Version=$VERSION" \
            -o "dist/kryptic_darwin_${GOARCH}" ./cmd/kryptic

      - name: Build macOS app
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x macos/build.sh
          ./macos/build.sh

      - name: Apply release version to app
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          PLIST="macos/dist/Kryptic.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$PLIST"

      - name: Sign CLI and app
        shell: bash
        env:
          APP_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          # Sign the standalone CLI that will be uploaded to GitHub Releases.
          codesign --force --options runtime --timestamp \
            --sign "$APP_IDENTITY" \
            "dist/kryptic_darwin_${GOARCH}"

          # Sign nested executables first, then the app bundle itself.
          codesign --force --options runtime --timestamp \
            --sign "$APP_IDENTITY" \
            "macos/dist/Kryptic.app/Contents/MacOS/kryptic"

          codesign --force --options runtime --timestamp \
            --sign "$APP_IDENTITY" \
            "macos/dist/Kryptic.app/Contents/MacOS/KrypticDaemon"

          codesign --force --options runtime --timestamp \
            --sign "$APP_IDENTITY" \
            "macos/dist/Kryptic.app"

          codesign --verify --deep --strict --verbose=2 "macos/dist/Kryptic.app"
          codesign --verify --strict --verbose=2 "dist/kryptic_darwin_${GOARCH}"

      - name: Build signed PKG installer
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          INSTALLER_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail

          mkdir -p release
          pkgbuild \
            --component "macos/dist/Kryptic.app" \
            --install-location "/Applications" \
            --scripts "macos/pkg/scripts" \
            --identifier "${BUNDLE_ID}.pkg" \
            --version "$VERSION" \
            --sign "$INSTALLER_IDENTITY" \
            "release/Kryptic-${VERSION}-macos-${LABEL}.pkg"

      - name: Create signed DMG
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          APP_IDENTITY: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail

          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          mkdir -p "$DMG_ROOT"
          ditto "macos/dist/Kryptic.app" "$DMG_ROOT/Kryptic.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "Kryptic" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "release/Kryptic-${VERSION}-macos-${LABEL}.dmg"

          codesign --force --timestamp \
            --sign "$APP_IDENTITY" \
            "release/Kryptic-${VERSION}-macos-${LABEL}.dmg"

      - name: Prepare Apple notarization key
        shell: bash
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "$NOTARY_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple PKG
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG="release/Kryptic-${VERSION}-macos-${LABEL}.pkg"

          command -v jq >/dev/null 2>&1 || brew install jq

          SUBMISSION_JSON="$(xcrun notarytool submit "$PKG" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --output-format json)"

          SUBMISSION_ID="$(echo "$SUBMISSION_JSON" | jq -r '.id')"

          if [[ -z "$SUBMISSION_ID" || "$SUBMISSION_ID" == "null" ]]; then
            echo "Failed to get PKG notarization submission ID"
            echo "$SUBMISSION_JSON"
            exit 1
          fi

          echo "PKG notarization submission ID: $SUBMISSION_ID"

          STATUS=""

          for i in {1..90}; do
            INFO="$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --output-format json)"

            STATUS="$(echo "$INFO" | jq -r '.status')"

            echo "PKG notarization status: $STATUS (attempt $i/90)"

            if [[ "$STATUS" == "Accepted" ]]; then
              break
            fi

            if [[ "$STATUS" == "Invalid" ]]; then
              echo "Apple rejected PKG notarization: $SUBMISSION_ID"

              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_PATH" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" || true

              exit 1
            fi

            sleep 20
          done

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Timed out waiting for PKG notarization."
            echo "Submission ID: $SUBMISSION_ID"
            exit 1
          fi

          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

      - name: Notarize and staple DMG
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="release/Kryptic-${VERSION}-macos-${LABEL}.dmg"

          command -v jq >/dev/null 2>&1 || brew install jq

          SUBMISSION_JSON="$(xcrun notarytool submit "$DMG" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --output-format json)"

          SUBMISSION_ID="$(echo "$SUBMISSION_JSON" | jq -r '.id')"

          if [[ -z "$SUBMISSION_ID" || "$SUBMISSION_ID" == "null" ]]; then
            echo "Failed to get DMG notarization submission ID"
            echo "$SUBMISSION_JSON"
            exit 1
          fi

          echo "DMG notarization submission ID: $SUBMISSION_ID"

          STATUS=""

          for i in {1..90}; do
            INFO="$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --output-format json)"

            STATUS="$(echo "$INFO" | jq -r '.status')"

            echo "DMG notarization status: $STATUS (attempt $i/90)"

            if [[ "$STATUS" == "Accepted" ]]; then
              break
            fi

            if [[ "$STATUS" == "Invalid" ]]; then
              echo "Apple rejected DMG notarization: $SUBMISSION_ID"

              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_PATH" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" || true

              exit 1
            fi

            sleep 20
          done

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Timed out waiting for DMG notarization."
            echo "Submission ID: $SUBMISSION_ID"
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify Gatekeeper acceptance
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 "macos/dist/Kryptic.app"
          spctl --assess --type install --verbose=4 "release/Kryptic-${VERSION}-macos-${LABEL}.pkg"

      - name: Copy signed app ZIP and standalone CLI
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "macos/dist/Kryptic.app" \
            "release/Kryptic-${VERSION}-macos-${LABEL}.zip"
          cp "dist/kryptic_darwin_${GOARCH}" release/

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows amd64
    needs: validate
    runs-on: windows-2025
    environment: release-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build Windows executables
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $versionFlag = "-X github.com/dev-kryptic/daemon/internal/server.Version=$env:VERSION"

          go build -trimpath -ldflags $versionFlag -o dist/kryptic_windows_amd64.exe ./cmd/kryptic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          go build -trimpath -ldflags "-H windowsgui $versionFlag" -o dist/kryptic-tray_windows_amd64.exe ./cmd/kryptic-tray
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows executables with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\kryptic_windows_amd64.exe
            ${{ github.workspace }}\dist\kryptic-tray_windows_amd64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Kryptic
          description-url: https://kryptic.dev
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Generate Inno Setup definition
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PUBLISHER: ${{ vars.COMPANY_NAME }}
          COMPANY_URL: ${{ vars.COMPANY_URL }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $iss = @"
          [Setup]
          AppId={{8F594D7B-7F43-4A1E-9A1C-BA257604DB11}
          AppName=Kryptic
          AppVersion=$env:VERSION
          AppVerName=Kryptic $env:VERSION
          AppPublisher=$env:PUBLISHER
          AppPublisherURL=$env:COMPANY_URL
          AppSupportURL=https://kryptic.dev
          AppUpdatesURL=https://kryptic.dev
          DefaultDirName={autopf}\Kryptic
          DefaultGroupName=Kryptic
          UninstallDisplayIcon={app}\kryptic-tray.exe
          SetupIconFile=cmd\kryptic-tray\assets\logo.ico
          OutputDir=release
          OutputBaseFilename=Kryptic-Setup-$env:VERSION-windows-amd64
          Compression=lzma2
          SolidCompression=yes
          CloseApplications=no
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          ChangesEnvironment=yes
          PrivilegesRequired=admin
          WizardStyle=modern
          VersionInfoVersion=$env:VERSION
          VersionInfoCompany=$env:PUBLISHER
          VersionInfoDescription=Kryptic Installer
          VersionInfoProductName=Kryptic
          VersionInfoProductVersion=$env:VERSION

          [Files]
          Source: "dist\kryptic_windows_amd64.exe"; DestDir: "{app}"; DestName: "kryptic.exe"; Flags: ignoreversion
          Source: "dist\kryptic-tray_windows_amd64.exe"; DestDir: "{app}"; DestName: "kryptic-tray.exe"; Flags: ignoreversion

          [Registry]
          Root: HKLM; Subkey: "SYSTEM\CurrentControlSet\Control\Session Manager\Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Check: NeedsAddPath(ExpandConstant('{app}'))

          [Icons]
          Name: "{autoprograms}\Kryptic"; Filename: "{app}\kryptic-tray.exe"

          [Run]
          Filename: "{app}\kryptic-tray.exe"; Description: "Start Kryptic"; Flags: nowait postinstall skipifsilent

          [Code]
          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var
            ResultCode: Integer;
          begin
            { Stop the previous install without /T. The setup exe is often a
              child of kryptic-tray (Check for Updates); killing the tree would
              close this installer. Credential Manager keeps the session. }
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /IM kryptic-tray.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /IM kryptic.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Result := '';
          end;

          function NeedsAddPath(Param: string): Boolean;
          var
            Paths: string;
          begin
            if not RegQueryStringValue(HKEY_LOCAL_MACHINE,
              'SYSTEM\CurrentControlSet\Control\Session Manager\Environment',
              'Path', Paths) then
              Paths := '';
            Result := Pos(';' + Uppercase(Param) + ';',
              ';' + Uppercase(Paths) + ';') = 0;
          end;
          "@

          # Remove indentation introduced by the YAML block.
          $iss = ($iss -split "`r?`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`r`n"
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Windows installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Kryptic
          description-url: https://kryptic.dev
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @(
            "dist\kryptic_windows_amd64.exe",
            "dist\kryptic-tray_windows_amd64.exe"
          ) + @(Get-ChildItem release\*.exe | ForEach-Object { $_.FullName })

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file => $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $file ($($sig.Status))"
            }
          }

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          Copy-Item dist\kryptic_windows_amd64.exe release\
          Copy-Item dist\kryptic-tray_windows_amd64.exe release\

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux ${{ matrix.goarch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Linux binaries
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist release
          VERSION_FLAG="-X github.com/dev-kryptic/daemon/internal/server.Version=$VERSION"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags "$VERSION_FLAG" \
            -o "dist/kryptic_linux_${GOARCH}" ./cmd/kryptic

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags "$VERSION_FLAG" \
            -o "dist/kryptic-tray_linux_${GOARCH}" ./cmd/kryptic-tray

      - name: Stage Linux binaries
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          cp "dist/kryptic_linux_${GOARCH}" release/
          cp "dist/kryptic-tray_linux_${GOARCH}" release/

      # .deb publish is paused until the Snap Store listing is in App Center.
      - name: Build DEB installer
        if: false
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
          DEBARCH: ${{ matrix.goarch }}
          MAINTAINER: ${{ vars.COMPANY_NAME }}
        run: |
          set -euo pipefail
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh \
            --version "$VERSION" \
            --debarch "$DEBARCH" \
            --cli "dist/kryptic_linux_${GOARCH}" \
            --tray "dist/kryptic-tray_linux_${GOARCH}" \
            --out "release/kryptic_${VERSION}_${DEBARCH}.deb"

      - name: Import Linux release signing key
        if: false
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/kryptic-release-signing.asc"
          gpg --batch --import "$RUNNER_TEMP/kryptic-release-signing.asc"

      - name: Sign DEB
        if: false
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DEBARCH: ${{ matrix.goarch }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          DEB="release/kryptic_${VERSION}_${DEBARCH}.deb"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --armor --detach-sign \
            --output "${DEB}.asc" \
            "$DEB"
          gpg --verify "${DEB}.asc" "$DEB"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - validate
      - macos
      - windows
      - linux

    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: List final artifacts
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate final SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f \
            ! -name 'checksums.txt' \
            ! -name 'checksums.txt.asc' \
            -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Import Linux/release signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/kryptic-release-signing.asc"
          gpg --batch --import "$RUNNER_TEMP/kryptic-release-signing.asc"

      - name: Sign checksums
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --armor --detach-sign \
            --output release/checksums.txt.asc \
            release/checksums.txt

          gpg --verify release/checksums.txt.asc release/checksums.txt

      - name: Notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          notes_file = pathlib.Path(os.environ["NOTES_FILE"])
          lines = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          pattern = re.compile(rf"^## \[?{re.escape(version)}\]?(?:\s|$)")
          start = next((i for i, line in enumerate(lines) if pattern.match(line)), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no ## {version} section")
          end = next(
              (j for j in range(start + 1, len(lines)) if lines[j].startswith("## ")),
              len(lines),
          )
          body = "\n".join(lines[start:end]).strip() + "\n"
          notes_file.write_text(body)
          print(body)
          PY
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and uploading/replacing assets."
            gh release edit "$TAG" --title "Kryptic $VERSION" --notes-file "$NOTES_FILE"
            for file in release/*; do
              gh release upload "$TAG" "$file" --clobber
            done
          else
            gh release create "$TAG" \
              release/* \
              --title "Kryptic $VERSION" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi

  # Apt repository publish is paused until the GitHub Pages deploy path is ready.
  apt-repo:
    name: Build apt repository
    if: false
    needs:
      - validate
      - release

    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-linux-*
          path: release
          merge-multiple: true

      - name: Import Linux release signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/kryptic-release-signing.asc"
          gpg --batch --import "$RUNNER_TEMP/kryptic-release-signing.asc"

      - name: Build signed apt repository
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -qy dpkg-dev apt-utils
          chmod +x packaging/linux/build-apt-repo.sh
          packaging/linux/build-apt-repo.sh \
            --version "$VERSION" \
            --key-id "$GPG_KEY_ID" \
            --out apt-repo \
            --deb "release/kryptic_${VERSION}_amd64.deb" \
            --deb "release/kryptic_${VERSION}_arm64.deb"

      - name: Verify repository signature
        shell: bash
        run: |
          set -euo pipefail
          gpg --verify apt-repo/dists/stable/Release.gpg apt-repo/dists/stable/Release
          gpg --verify apt-repo/dists/stable/InRelease

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-repo

  apt-repo-publish:
    name: Publish apt repository
    if: false
    needs:
      - apt-repo

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      # GITHUB_TOKEN cannot create a Pages site (admin API). Enable it once in
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
