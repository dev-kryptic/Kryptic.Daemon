name: Bug report
description: Something is broken or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must go to security@kryptic.dev, not here.
        See https://kryptic.dev/security/disclosure.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, versions, and the smallest steps that show the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version, git tag, or commit.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and anything else needed to reproduce.
